name: Worldwide Covers Monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'postage/**'
      - 'countries/**'
      - 'polar/**'
      - 'sources.json'
      - 'monitor.py'
      - 'tests/**'
      - 'data/items.js'
      - 'data/sources.js'
      - 'index.html'
      - '.github/workflows/monitor.yml'
  schedule:
    - cron: '37 8 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: read

concurrency:
  group: worldwide-covers-site-deployment
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test bulletin parsers
        run: python -m unittest discover -s tests -v

      # Data, site, or postage changes deploy the current archive without running the full bulletin scraper.
      - name: Quellen pruefen
        if: github.event_name != 'push'
        run: python monitor.py

      - name: Archiv aktualisieren
        if: github.event_name != 'push'
        run: |
          git config user.name "worldwide-covers-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Automatische Quellenpruefung"
            git push
          fi

      - name: Website vorbereiten
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          mkdir -p site/postage
          cp postage/index.html postage/rates.json site/postage/
          mkdir -p site/countries
          cp countries/index.html site/countries/index.html
          mkdir -p site/polar
          cp polar/index.html polar/stations.json polar/land.json site/polar/
          cp data/items.js data/items.json data/sources.js site/data/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
