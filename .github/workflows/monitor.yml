name: Worldwide Covers Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Quellen pruefen
        run: python monitor.py

      - name: Archiv aktualisieren
        run: |
          git config user.name "worldwide-covers-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Automatische Quellenpruefung"
            git push
          fi

      - name: Website vorbereiten
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          mkdir -p site/postage
          cp postage/index.html postage/rates.json site/postage/
          cp data/items.js data/sources.js site/data/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
